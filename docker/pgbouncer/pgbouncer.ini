;; PgBouncer, in transaction mode, with the connection budget plan 55's spec states.
;;
;; Every number here is one the certification report asserts against, so changing one changes what the
;; report means. The spec's table is the source: ≤ 80 database backends, ≤ 100 PostgreSQL connections,
;; cl_waiting 0 in ≥ 95% of samples.

;; The upstream is written by the entrypoint into the tmpfs and included here, not named in this file.
;;
;; That was always the stated intent — "a host in a committed file is one edit away from being the wrong
;; host" — but the file used to hardcode `host=db`, the compose service name, which made the comment a
;; description of something it did not do. It also made the image unusable anywhere `db` is not the
;; hostname: CI reaches PostgreSQL on `127.0.0.1`, and Coolify's private network uses its own service name.
;;
;; `PGBOUNCER_UPSTREAM_HOST` and `PGBOUNCER_UPSTREAM_PORT` set it, defaulting to `db:5432` so the compose
;; profile keeps working with no environment at all.
%include /run/pgbouncer/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; ── Auth ────────────────────────────────────────────────────────────────────────────────────────
;;
;; SCRAM, not md5: PostgreSQL 18 stores SCRAM verifiers and md5 would mean weakening the server to suit
;; the pooler. `auth_file` lives under /run/pgbouncer, which is the tmpfs, and is generated at 0600 by the
;; entrypoint. It used to live beside this file in /etc/pgbouncer, and mounting the tmpfs there shadowed
;; *this file*: the container could not start at all under compose — `could not load file
;; "/etc/pgbouncer/pgbouncer.ini": No such file or directory`, restarting forever, while the image itself
;; built clean and `--version` answered correctly. Runtime state and baked configuration need separate
;; directories. See the note there about
;; why an auth file never lives in an image layer.
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt

;; ── Pool mode ───────────────────────────────────────────────────────────────────────────────────
;;
;; `transaction`, which is the whole point: a session-mode pooler holds a server connection for the life of
;; a client connection and would cap concurrency at `default_pool_size` clients rather than at that many
;; simultaneous *transactions*.
;;
;; The cost is real and worth stating: session-level state does not survive a transaction boundary. This
;; app uses `SET LOCAL` for tenant context (transaction-scoped, safe) and has no `LISTEN`, no session
;; advisory locks held across statements, and no prepared statements outside a transaction — which is why
;; transaction mode is available at all. `tests/e2e/api/pgbouncer-compatibility.spec.ts` is what proves
;; that claim rather than asserting it.
pool_mode = transaction

;; ── The budget ──────────────────────────────────────────────────────────────────────────────────
;;
;; 12 + 4 reserve per (user, database) pair, capped at 80 database backends in total. Five roles × 12 is
;; 60, and the reserve is what absorbs a burst without letting the sum reach PostgreSQL's 120.
;;
;; `max_db_connections` is the ceiling the report checks, so it is set here rather than left to the
;; arithmetic of the pool sizes: a sixth role added later must hit this limit and wait, not quietly take
;; the budget past what PostgreSQL was configured for.
default_pool_size = 12
reserve_pool_size = 4
reserve_pool_timeout = 3
max_db_connections = 80

;; 500 clients against 80 backends is the multiplexing this exists for. 1,000 virtual users each doing one
;; request per ~2.25 s never need 1,000 simultaneous connections — the spec says so explicitly, and this is
;; the number that encodes it.
max_client_conn = 500

;; ── Timeouts ────────────────────────────────────────────────────────────────────────────────────
;;
;; Deliberately *longer* than the app's own 5-second `statement_timeout`. The pooler must not be the thing
;; that cancels a query, or a timeout an operator traced to the database would actually have come from
;; here — a much harder failure to diagnose than the one it replaces.
query_timeout = 30
query_wait_timeout = 15
client_idle_timeout = 0
server_idle_timeout = 60
server_lifetime = 3600

;; ── Observability ───────────────────────────────────────────────────────────────────────────────
;;
;; `SHOW POOLS` and `SHOW STATS` are what the monitor samples every five seconds for `cl_waiting` and
;; `maxwait`. Restricting the admin user to `pgbouncer` keeps that surface off the five application roles.
admin_users = pgbouncer
stats_users = pgbouncer

;; Connection churn at info level would be one line per transaction at 444 req/s. The counters are the
;; signal; the log is for failures.
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

;; stderr, so `docker compose logs` and the container runtime own the output rather than a file inside a
;; container nobody keeps.
logfile =
pidfile =
