      - run: pnpm build
      # The base roles first. `quality.yml` runs these long before its preview block, so the block
      # copied from it assumed they existed — here nothing had created them, so the migrations had no
      # roles to grant to, the seed wrote nothing, and the admin read-back below came up empty.
      - run: pnpm test:migrations:local
      - run: node scripts/db/prepare-rls-fixture.mjs

      - name: Migrate + seed admin for the production-preview accessibility gate
        run: |
          pnpm exec drizzle-kit migrate
          pnpm db:seed:admin

          # Seeding creates the admin *user*; ADMIN_USER_IDS is what makes them a platform admin —
          # `auth-session.ts` reads that env list and nothing else. Without it every `/admin/*`
          # route's `requirePlatformAdminPage` redirects, which is why the status-trust regression
          # timed out waiting for `admin-incidents-page`: the page was never going to render, and
          # the screenshot showed the dashboard it had been redirected to.
          #
          # It cannot be hardcoded — `seed-admin.ts` mints a fresh `crypto.randomUUID()` per run —
          # so it is read back from the row that was just written and exported for the preview
          # server that later steps start. A developer never hits this because their `.env` names
          # the id their local database already has.
          ADMIN_ID="$(psql "$DATABASE_MIGRATION_URL" -Atc "select id from auth_users where email = 'edd_admin@local.com'")"
          if [ -z "$ADMIN_ID" ]; then
            echo "Seeded admin not found — every /admin/* gate would redirect." >&2
            exit 1
          fi
          echo "ADMIN_USER_IDS=$ADMIN_ID" >> "$GITHUB_ENV"
          echo "Platform admin: $ADMIN_ID"
      # `pnpm preview --port 3000 &` on its own loses the server the moment the step ends: the
      # background process inherits the step's stdout pipe, the runner closes that pipe at the step
      # boundary, and the next write earns an EPIPE. `/api/health` is a static 200 that touches neither
      # the DB nor Redis, so a health timeout here never meant "the app is unhealthy" — it meant the
      # server was already dead. Redirecting to a file (which is also what scripts/ci/local-quality.sh
      # does, and why the same gate passed locally while failing here) keeps it alive, and printing
      # that file on failure means the next timeout arrives with the server's own reason attached
      # instead of six words and a dead end.
      # `vite preview` serves the production build with NODE_ENV=production, which switches on the
      # production half of the env contract (src/shared/lib/env.ts: `if (data.NODE_ENV !== 'production')
      # return`). The job-level env points every role URL at the postgres superuser, and production
      # rightly refuses that: the runtime role must not be an owner, and the migration, auth, worker and
      # product identities must all be distinct. Left unset, the server accepted the connection, then
      # threw a ZodError on the first request and answered 500 — so `curl -sf` saw an unhealthy server
      # for sixty seconds while the process itself was perfectly alive.
      #
      # Giving it the four real roles is not a workaround: the accessibility gate is the only step that
      # exercises the app as production assembles it, so it should hold the role separation production
      # requires. The passwords are the fixture's CI values (scripts/db/prepare-rls-fixture.mjs), which
      # this job already applied to the shared roles because CI=true.
      - name: Start production preview
        env:
          DATABASE_URL: postgres://builderhunt_app:test-app-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_AUTH_URL: postgres://builderhunt_auth:test-auth-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_WORKER_URL: postgres://builderhunt_worker:test-worker-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_PLATFORM_URL: postgres://builderhunt_platform:test-platform-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_MIGRATION_URL: postgres://postgres:postgres@127.0.0.1:5432/builderhunt_security_test_ci
        run: |
          nohup pnpm preview --port 3000 > /tmp/preview.log 2>&1 &
          disown
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          echo "Preview server never became healthy; its output follows." >&2
          cat /tmp/preview.log >&2 || echo "(no /tmp/preview.log was written)" >&2
          exit 1

      # Reuses the preview the accessibility gate just stood up — same build,
      # same least-privilege roles. Running Lighthouse against `vite dev`
      # instead would measure the dev module graph, which tells you nothing
      # about what a visitor gets.
      - name: Lighthouse budgets
        run: pnpm test:lighthouse
      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: tests/artifacts/lighthouse/
          retention-days: 14

  # Optional, additive certification of the real Stripe-backed BillingProvider
  # (src/shared/lib/billing/real-provider.ts) against Stripe's actual test-mode API — never a
  # replacement for the `quality` job above, which never talks to Stripe (FakeBillingProvider only).
  # Runs only when a real Stripe test-mode secret key is configured as a repo/org secret; skipped
  # entirely (not failed) otherwise, so forks and contributors without Stripe credentials are never
  # blocked. `continue-on-error: true` because it depends on a live third-party API — network
  # flakiness or a Stripe-side issue must never block a merge; see
  # docs/operations/stripe-sandbox-certification.md for what this does and doesn't certify.
  #
  # DO NOT gate this job with `if: ${{ secrets.X != '' }}`. The `secrets` context is NOT available in
  # `jobs.<job_id>.if` (only `github`, `needs`, `vars`, and `inputs` are), and referencing an
  # unavailable context there is a workflow *validation* error rather than a job error: GitHub
  # rejects the whole file before creating a single job, so every run — including the `quality` job
  # below, which has nothing to do with Stripe — dies in 0s with "This run likely failed because of a
  # workflow file issue" and no logs or annotations to explain it. That is exactly what happened
  # between 2026-07-24 and 2026-07-27, which also left `deploy.yml` permanently skipped because it
  # keys off a successful Quality run.
  #
  # `secrets` IS available in `jobs.<job_id>.env`, and `env` IS available in a step-level `if`, so the
  # presence check lives on the steps instead. Every step is gated, so with no key configured the job
  # claims a runner, skips everything, and finishes in seconds.
  # Exists only to answer "is the secret configured?" in a place a job-level `if` can read.
  #
  # The `secrets` context is not available in `jobs.<id>.if` — only github, needs, vars and inputs
  # are — so a job that wants to skip itself on a missing secret has to be told by another job.
  # Without this the certification job ran, skipped all seven of its steps, and reported **success
  # in 4 seconds**: a green check against the commit for a certification that has not executed
  # since the secret was last present. That is worse than a red one, because nobody investigates a
  # tick.
  stripe-secret-present:
    name: Is a Stripe sandbox secret configured?
    runs-on: ubuntu-latest
    # A hung job bills the runner default of six hours. On a metered account that is the
    # difference between a bad run and a bad month.
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.probe.outputs.configured }}
    steps:
      # Read through `env:` and test the runtime value, rather than comparing the secret inside an
      # expression. The expression form answered `false` against a secret that `gh secret list`
      # showed as present — which is the one case worth separating: a secret can exist with an empty
      # or whitespace value, and the listing shows only names and dates, never values or lengths.
      #
      # The length is safe to print. GitHub masks the value itself in logs, and a character count is
      # what tells "never set" apart from "set to nothing" — the two states that look identical from
      # outside and have completely different fixes.
      - id: probe
        env:
          KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
        run: |
          TRIMMED="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          echo "secret length: ${#KEY} characters (${#TRIMMED} after trimming whitespace)"
          if [ -n "$TRIMMED" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ STRIPE_SANDBOX_SECRET_KEY exists but is empty — certification skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The one job that must NOT mint a placeholder: it authenticates against real test-mode Stripe with
  # the repository secret, and `$GITHUB_ENV` takes precedence over a job's `env:` — so inserting the
  # mint step here silently replaced a working key with sixteen random bytes and failed the
  # certification that had just started passing.
  stripe-sandbox-certification:
    name: Stripe sandbox certification (optional, real test-mode API)
    runs-on: ubuntu-latest
    # A hung job bills the runner default of six hours. On a metered account that is the
    # difference between a bad run and a bad month.
    timeout-minutes: 30
    needs: stripe-secret-present
    # Skipped, not green, when there is nothing to certify with. The run page then shows this job
    # grey and the reason is one click away, instead of a tick that reads as "Stripe is certified".
    if: needs.stripe-secret-present.outputs.configured == 'true'
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      # The same secret under its other name, because the three certification suites do not agree on
      # which variable to read: `real-provider.test.ts` reads STRIPE_SECRET_KEY, while
      # `test-clock-lifecycle.test.ts` and `canary-certification.test.ts` read STRIPE_SANDBOX_SECRET_KEY
      # (deliberately — locally those two create and destroy sandbox objects and should not share an
      # idempotency namespace with the running app's key). With only the first exported, the other two
      # suites `describe.skipIf` themselves into a green no-op and CI would report a certification it
      # never ran. Two names, one secret, all three actually execute.
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_API_VERSION: '2026-06-24.dahlia'
      RUN_STRIPE_INTEGRATION_TESTS: '1'
    steps:
      # The job only runs when the secret exists, so this says so rather than deciding it. When it
      # does not exist the job is skipped outright and the run page shows that in grey — which is
      # the whole point: the previous shape reported success in four seconds with every step
      # skipped, and a green tick is not a place anyone looks for a missing secret.
      - run: echo "✅ Certifying against real test-mode Stripe." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Certify the real Stripe adapter (14 provider methods)
        run: pnpm vitest run tests/unit/shared/lib/billing/real-provider.test.ts
      # Separate steps rather than one vitest invocation, so a failure names which certification broke.
      - name: Certify the Denmark canary observations test mode can prove
        run: pnpm vitest run tests/unit/shared/lib/billing/canary-certification.test.ts
      - name: Certify the Test Clock subscription lifecycle
        # Last because it is by far the slowest — it advances real Stripe test clocks and waits for
        # Stripe to process each jump asynchronously.
        run: pnpm vitest run tests/unit/shared/lib/billing/test-clock-lifecycle.test.ts
