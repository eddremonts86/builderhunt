name: Advisory

# Checks worth having that must not stand between a correct commit and production.
#
# They used to live in `quality.yml`. Marking them `continue-on-error` kept them out of the run's
# *conclusion* but not out of its *duration*: `deploy.yml` triggers on `workflow_run: completed`,
# and a run is only complete when every job in it is — so a five-minute screenshot diff and a
# Lighthouse pass still stood between a green build and a deploy. Moving them to their own workflow
# is what actually takes them off that path.
#
# Same trigger as Quality, so they still run on every push to master. They just run beside it.
#
# And they are allowed to fail. They carried `continue-on-error` while they lived in `quality.yml`,
# where it was the only way to keep them out of the deploy's way — here it would do nothing except
# report green on a check that failed, which is the state this repo has already been bitten by twice
# (a Stripe certification "succeeding" in four seconds with every step skipped, and a visual gate
# that had not run in months). A red mark on the commit is the entire point of running these.

on:
  pull_request:
  push:
    branches: [master, dev]
    paths-ignore:
      - 'docs/**'
      - 'plans/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The empty-state baselines are of a signed-in dashboard, so this job stands up the app and needs
    # the same database and env as any other that does. Built without them, its dev server died on a
    # ZodError before taking a single screenshot — a failure that reads like a visual regression and
    # is a missing env block.
    services:
      postgres:
        # Production moved to PostgreSQL 18 on 2026-08-05 (postgres-18-upgrade
        # Phase 4), so this is once again "the version that is actually
        # deployed". The transitional second DB-only job that ran the
        # version-sensitive steps against the newer major is deleted with it —
        # one DB-bearing job again, pinned to the same major and the same
        # pgvector build as the production resource `ekq4rkiqtyl5nzzb3cc32kkg`.
        #
        # Keep this pin and the production resource's image in lockstep: a plain
        # `postgres:18` makes `CREATE EXTENSION vector` fail inside migration
        # 0013, which rolls back every migration in the same transaction.
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: builderhunt_security_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Required by the E2E harness, not optional. `playwright.config.ts` defaults REDIS_URL to
      # redis://localhost:6379 and `tests/e2e/harness/cache.ts` refuses to run without it — E2E deliberately
      # exercises the real cache path, because the in-memory rate-limit fallback is forbidden under
      # E2E_MODE. Without this service every spec failed with "Connection is closed" against a port
      # nothing was listening on. Same image and port as the `redis` service in docker-compose.yml, so
      # local and CI agree.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/builderhunt_security_test_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/builderhunt_security_test_ci
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/builderhunt_security_test_ci
      DATABASE_AUTH_URL: postgresql://builderhunt_auth:test-auth-password@127.0.0.1:5432/builderhunt_security_test_ci
      DATABASE_WORKER_URL: postgresql://builderhunt_worker:test-worker-password@127.0.0.1:5432/builderhunt_security_test_ci
      DATABASE_PLATFORM_URL: postgresql://builderhunt_platform:test-platform-password@127.0.0.1:5432/builderhunt_security_test_ci
      # Not optional here, despite being optional in the app.
      #
      # `capability-db.ts` falls back to the worker URL when this is unset, and
      # `workerDatabaseUrls` only applies its `forceRole` when the source URL names a user
      # that is *not* already a base role. The worker URL names one, so the fallback kept
      # `builderhunt_worker` and the public candidate flow connected as the worker.
      # drizzle/0078 revokes EXECUTE on `scheduling_resolve_capability` from that role and
      # grants it to `builderhunt_capability`, so every capability exchange raised
      # `permission denied for function`, which the route catches and reports as a coded
      # `invalid_input` — about 45 failures across scheduling, interviews, documents and
      # billing-credits, all reading as one unexplained 400.
      #
      # Reproduced locally by removing this variable alone: scheduling.spec.ts goes from 5
      # failures to 10, with the `permission denied` visible in the server log.
      DATABASE_CAPABILITY_URL: postgresql://builderhunt_capability:test-capability-password@127.0.0.1:5432/builderhunt_security_test_ci
      APP_URL: http://localhost:3000
      VITE_APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      # Defaults to 'false' in env.ts; `.env.example` turns it on, which is how it is on
      # every developer machine. CI has no `.env`, so it ran the calendar surface switched
      # off and `tests/e2e/calendar.spec.ts` asserted against `503 dependency_unavailable`
      # instead of the routes it was written for — eight of its eleven failures were that.
      #
      # This block used to say CALENDAR_ENABLED was the only flag that belonged here, on the
      # grounds that SCHEDULING_ENABLED is set per-spec through `startInterviewHarness`'s `flags`
      # and setting it globally would disturb that restore. Two things were wrong with it. Only
      # four specs pass that flag, and `.env` sets it globally anyway — so the "leak vector" has
      # been the local configuration all along, and the suite is green under it. Meanwhile CI ran
      # every other spec with the feature off, which is the divergence that mattered.
      CALENDAR_ENABLED: 'true'

      # ── Test-only credentials the app refuses to run without ────────────────────────────────────
      #
      # None of these are secrets. They exist because the code checks that a value is *present and
      # well-formed* before it will do the thing under test, and CI had none of them — so twenty
      # e2e specs failed here while passing locally, where `.env` supplies them and dotenvx injects
      # it into every process. That asymmetry is the bug: `scripts/ci/local-quality.sh` cannot
      # certify a gate whose environment it does not reproduce, and it has now certified a red CI
      # twice. Anything added to `.env` that the app *requires* has to be mirrored here, with a
      # CI-only value, or the local gate is measuring a different program.
      #
      # Fake on purpose, and visibly so. A real key in a public workflow file would be a leak, and
      # every one of these paths is stubbed under E2E_MODE — the AI provider by
      # `tests/e2e/harness/fakes/ai.ts`, outbound calls by the egress fake — so nothing here ever
      # reaches a third party.

      # Drives the recurrence and retention workers (calendar, interview-privacy). Any non-empty
      # string; the routes only compare it against the caller's header.
      CRON_SECRET: ci-only-cron-secret-not-a-real-one


      # `run-enrichment.ts` answers 503 `ai_unconfigured` when either of these is missing, which is
      # what the AI, work-sample and portfolio specs were actually asserting against.
      MINIMAX_API_KEY: ci-only-not-a-real-key
      DEEPGRAM_API_KEY: ci-only-not-a-real-key
      # Present, not reachable. `embed.ts` guards on these being *set* before it will do anything,
      # and `embeddings.ts` swaps in the E2E stub before any HTTP call whenever a spec sets
      # E2E_EMBEDDINGS_SCENARIO — which is why its own docblock says it has "no dependency on a
      # local embedding server being up". It still 503'd here, because the guard fires first.
      # The specs that genuinely need a provider carry @requires-embeddings and the step below
      # greps them out; this one does not, and should not.
      AI_EMBEDDING_URL: http://localhost:11434/v1/embeddings
      AI_EMBEDDING_MODEL: nomic-embed-text
      AI_EMBEDDING_DIM: '768'
      # `analyze.ts` documents its precedence: unavailable (503) is answered before the plan
      # check (429), so without a token the work-sample spec never reaches the assertion it is
      # named for. The value is never sent anywhere — the egress fake blocks the call.
      #
      # Set at job level rather than on the step: Actions reserves the `GITHUB_` prefix for
      # variables *it* defines, and `GITHUB_TOKEN` is one of them — it is already present in every
      # job, holding the real, privileged workflow token. Naming it here shadows that token for
      # this job with a value that cannot authenticate anything, which is both what the app needs
      # and strictly safer than leaving the privileged one visible to a test suite that shells out.
      GITHUB_TOKEN: ci-only-not-a-real-token
      AI_DISABLED: 'false'

      # ── Flags whose local value is not the app default ──────────────────────────────────────────
      #
      # Mirrored from `.env` so CI runs the configuration the suite is green against. They arrive in
      # the runner locally through `tests/e2e/harness/load-env.ts`, which loads `.env` into the test
      # process — which is why "each spec sets what it needs" looked true and was true of two of
      # them. `env.ts` defaults every one of these to off, so CI was exercising a different product.
      SCHEDULING_ENABLED: 'true'
      CANDIDATE_UPLOADS_ENABLED: 'true'
      CANDIDATE_WEB_IMPORT_ENABLED: 'true'
      CALENDAR_OPERATIONAL_LAYERS_ENABLED: 'true'
      ACCESS_ALLOWLIST_ENABLED: 'true'
      DEVPOST_ENABLED: 'true'
      ABUSE_ENFORCEMENT_MODE: warn
      ENRICHMENT_ALLOWED_CONNECTORS: github
      # The billing suite drives the fake provider, but the page still renders its unavailable state
      # unless billing is on — `billing-journeys.spec.ts` waited 20s for content that was never
      # going to exist.
      STRIPE_BILLING_ENABLED: 'true'
      STRIPE_API_VERSION: 2026-06-24.dahlia

      # Where the documents suite puts candidate uploads and what scans them. The containers are
      # started in a step below, because a service container cannot be given a command.
      #
      # CANDIDATE_UPLOADS_ENABLED is deliberately NOT set here — `documents.spec.ts` turns it on
      # through `startInterviewHarness`'s `flags`, for the same reason SCHEDULING_ENABLED is left
      # to the specs above. These endpoint vars still belong in the job env: `env.ts` validates
      # them the moment that flag is true, and it validates in the worker process, which inherits
      # this block. 127.0.0.1 satisfies `isPrivateStorageHost`, so no jurisdiction rule applies.
      INTERVIEW_R2_ACCOUNT_ID: minio
      INTERVIEW_R2_ENDPOINT: http://127.0.0.1:9000
      INTERVIEW_R2_BUCKET: builderhunt-interview-documents
      INTERVIEW_R2_ACCESS_KEY_ID: builderhunt
      INTERVIEW_R2_SECRET_ACCESS_KEY: builderhunt-local-dev
      INTERVIEW_CLAMAV_HOST: 127.0.0.1
      INTERVIEW_CLAMAV_PORT: '3310'
    steps:
      - uses: actions/checkout@v7
      # Minted per run, never written down.
      #
      # `env.ts` validates the *shape* of these before the app boots — `^sk_(test|live)_`, `^whsec_`,
      # exactly 64 hex — so a CI placeholder has to look like the real thing, and looking like the real
      # thing is what a secret scanner reports. GitGuardian failed a pull request over literals that
      # said `ci_only_not_a_real_key` in their own text, and it was right to: a scanner cannot take a
      # string's word for it. Generating them removes the question instead of arguing it.
      - name: Mint CI-only credential placeholders
        run: |
          {
            echo "STRIPE_SECRET_KEY=sk_test_$(openssl rand -hex 12)"
            echo "STRIPE_WEBHOOK_SECRET=whsec_$(openssl rand -hex 16)"
            echo "WEBHOOK_PAYLOAD_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Cached across runs: the browser download is ~150 MB and the version only moves when the
      # lockfile does, so keying on it means one download per Playwright bump rather than per push.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # `empty-states.spec.ts` drives the same worker harness the e2e suite uses, and that harness
      # serves `dist/` now — so this job needs a build exactly as the e2e job does. Without it those
      # two specs die on "no build exists" while the twelve public-surface ones, which use the
      # config's own webServer, pass around them.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium

      # Before the preview, not after it. Playwright starts its own dev server for these
      # projects and `reuseExistingServer` is false under CI by design, so running this while
      # `pnpm preview` held port 3000 failed with "http://localhost:3000 is already used" —
      # nothing to do with a screenshot. The baselines were generated against that same dev
      # server, so this is also the configuration they were taken in.
      - name: Visual regression gate
        # Baselines are named per project *and* per OS, so this compares against the committed
        # `*-linux.png` files — generated on 2026-08-03 inside `mcr.microsoft.com/playwright:v1.61.1-jammy`,
        # the image matching this repo's pinned Playwright, and verified in both directions: 22 passing
        # unchanged, 14 of 22 failing on a deliberate one-pixel `body { padding-top: 1px }`. A visual gate
        # that cannot fail is decoration, so that second half was the actual precondition for turning this on.
        #
        # `test:visual` stands up its own `vite dev` via the config's `webServer` rather than reusing the
        # preview above. Deliberate: the baselines were captured against the dev server, and a screenshot
        # taken against a production build differs in ways that have nothing to do with the design.
        run: pnpm test:visual
      - name: Upload visual diff artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Playwright writes expected/actual/diff triplets here on failure — the only way to review a
          # screenshot regression without checking out the branch and re-running it.
          name: visual-diffs
          path: test-results/
          retention-days: 14
          # A job that dies before taking a screenshot leaves nothing here, and the default is to warn
          # about it — an annotation that reads like a second failure and is the absence of one.
          if-no-files-found: ignore

