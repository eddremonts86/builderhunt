name: Load smoke

# The load harness itself, exercised end to end on every change to it.
#
# ## What this is for, and what it deliberately is not
#
# It is not a capacity measurement. A GitHub runner is a shared two-core machine with unpredictable
# neighbours, so its percentiles describe the runner and would fail or pass for reasons that have nothing to
# do with the change under test. `scripts/load/smoke.ts` therefore gates on correctness only — requests
# happened, none 5xx'd, the observability samples have data behind them, neither artifact carries a credential
# — and prints the thresholds without gating on them.
#
# What it protects is the harness's own habit of producing *plausible* artifacts. Every bug found while
# building it was of that shape: a preflight that passed against an unseeded database, a monitor whose every
# sample failed while the report printed "0 connections ✅", a route table that sent all nine requests to one
# endpoint, a drain window that aborted any run longer than thirty seconds. None of those fail loudly. All of
# them are caught by running the thing and reading what comes out, which is what this job does.
#
# ## Why it is its own workflow rather than a step in Quality
#
# Quality is ~55 runner minutes and already gates every push. Adding a build-plus-server-plus-database smoke
# to it would slow the gate everyone waits on, to protect files almost no change touches. Scoped by `paths`,
# this runs when the harness changes and stays silent otherwise.
on:
  pull_request:
    paths:
      - 'scripts/load/**'
      - 'docker/pgbouncer/**'
      - 'tests/unit/scripts/load/**'
      - '.github/workflows/load-smoke.yml'
  push:
    branches: [master, dev]
    paths:
      - 'scripts/load/**'
      - 'docker/pgbouncer/**'
      - 'tests/unit/scripts/load/**'
      - '.github/workflows/load-smoke.yml'
  # The harness is also the thing an operator reaches for at 02:00, so it has to be runnable on demand
  # without pushing a commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # The build is the long pole. A hung job otherwise bills the six-hour runner default.
    timeout-minutes: 20
    services:
      postgres:
        # The same pin as Quality and as the production resource. A plain `postgres:18` makes
        # `CREATE EXTENSION vector` fail inside migration 0013, which rolls back every migration in the same
        # transaction — and the smoke migrates a database of its own, so it would hit exactly that.
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_USER: postgres
          # Per-run, not the literal `postgres` the other workflows use.
          #
          # GitGuardian's generic-password detector flagged the hardcoded pair and failed a required check on the
          # pull request. It is not wrong about the shape, even though this database lives for one job and is
          # reachable only from that job's network — so the fix removes the constant rather than suppressing the
          # detector, which would have weakened it for every future file too. `github.run_id` is unique per run and
          # available in both `services.*.env` and the job `env` below, so the two connection strings still match.
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Provisioned because the application expects it, not because the smoke asserts on it. Without Redis,
      # `rate-limit.ts` falls back to its in-memory counter — which works, and means the run measures a code
      # path production does not take. The service costs seconds; the fidelity is the point.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 127.0.0.1 and not `localhost`: on some runners `localhost` resolves to `::1` first while the service
      # container publishes on IPv4, and the failure reads as "database refused the connection".
      #
      # The smoke creates and migrates `builderhunt_load_test_smoke` from this URL. It never touches the
      # database named here, and `safety.ts` refuses outright unless the *target* name carries the disposable
      # prefix and the host is loopback.
      #
      # `DATABASE_MIGRATION_URL` is the owner, deliberately: migrations create roles and take advisory locks,
      # which is exactly what an owner is for, and `env.ts` expects this one to be privileged.
      DATABASE_MIGRATION_URL: postgresql://postgres:${{ github.run_id }}@127.0.0.1:5432/postgres
      #
      # `DATABASE_URL` is deliberately **absent** here, and that is the fix for the defect that kept this job
      # from ever completing.
      #
      # It used to be the same owner URL as the line above, and a production build refuses that outright:
      # `Production DATABASE_URL must use the non-owner application role`. The preview server died on its own
      # env validation, the smoke reported `❌ the preview server never answered /api/health`, and the actual
      # reason sat further down the log. `env.ts` is right to refuse — a superuser connection ignores GRANTs
      # and RLS, and this repository has three defects that hid behind exactly that.
      #
      # It is exported from `$GITHUB_ENV` by the role-password step below instead, because the app role's
      # password does not exist until that step mints it. Leaving it unset here means a future edit that drops
      # that step fails with `DATABASE_URL is not set` from `smoke.ts` — the true statement — rather than
      # silently falling back to the superuser and failing somewhere unrelated.
      APP_URL: http://127.0.0.1:3000
      VITE_APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      REDIS_URL: redis://127.0.0.1:6379
      NODE_OPTIONS: --max-old-space-size=4096
      # Fifteen, not the twenty-five the plan's task asked for.
      #
      # `better-auth.ts` caps `/sign-in/email` at 20 per minute per IP, and all fifteen virtual users sign in
      # from the runner. Twenty-five aborts on the 21st with a `429` — verified locally, and correct
      # behaviour from the application. The alternative is raising a brute-force guard to make a smoke pass,
      # which is not a trade worth making for a larger number in a correctness check. Fifteen users over
      # thirty seconds still reaches every route from the traffic mix and collects several five-second
      # observability samples.
      LOAD_SMOKE_USERS: '15'
      LOAD_SMOKE_SECONDS: '30'
    steps:
      - uses: actions/checkout@v4

      # `@v6` with an explicit `version`, matching every other workflow here.
      #
      # This was `@v4` with no `version` and no `packageManager` in `package.json` for the action to read, so the
      # job died on its third step with "No pnpm version is specified" — every time, from the moment it was
      # written. It had simply never run: this workflow only fires on a pull request, and the branch it was added
      # on had none until now. A CI job that has never executed is not a gate, whatever its file says.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, because they are seconds and they catch the unit-testable half of a regression before the
      # build spends minutes on the rest.
      - name: Unit tests for the load harness
        run: pnpm vitest run tests/unit/scripts/load/

      # ── The five application roles ───────────────────────────────────────────────────────────────
      #
      # Both legs need to connect as `builderhunt_app`, and giving a role a password requires the role to
      # exist. The roles are created by `drizzle/0002` and `drizzle/0012`, which the smoke runs — *inside* the
      # run that needs the password already set. So the migrations run once here first, and the roles they
      # create are cluster-global and outlive the database.
      #
      # Deliberately not hand-rolled `CREATE ROLE` statements: role creation, the GRANTs and the RLS policies
      # live in migrations and only in migrations, so a workflow that invents its own roles would be testing a
      # cluster this application never runs on. The cost is one extra `drizzle-kit migrate` — the smoke drops
      # and recreates this database and migrates it again — and that is the price of using the real path.
      #
      # `builderhunt_load_test_smoke` is the same name `scripts/load/smoke.ts` uses, so nothing here creates a
      # database outside the disposable prefix `safety.ts` enforces.
      - name: Create the application roles, by running the migrations that own them
        run: |
          set -euo pipefail
          PGPASSWORD=${{ github.run_id }} psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'drop database if exists builderhunt_load_test_smoke' \
            -c 'create database builderhunt_load_test_smoke'
          DATABASE_MIGRATION_URL=postgresql://postgres:${{ github.run_id }}@127.0.0.1:5432/builderhunt_load_test_smoke \
            pnpm exec drizzle-kit migrate
          missing=$(PGPASSWORD=${{ github.run_id }} psql -h 127.0.0.1 -U postgres -d postgres -Atc "
            select string_agg(r.name, ', ')
            from (values ('builderhunt_app'), ('builderhunt_auth'), ('builderhunt_worker'),
                         ('builderhunt_platform'), ('builderhunt_capability')) as r(name)
            where not exists (select 1 from pg_roles where rolname = r.name)")
          if [ -n "$missing" ]; then
            echo "::error::the migrations did not create: $missing — every step below authenticates as these"
            exit 1
          fi
          echo 'all five builderhunt_* roles exist'

      # The passwords are generated here and used in three places — the pooler's userlist, the app's URLs, and
      # the direct leg's `DATABASE_URL` — from one variable each. They are throwaway values for an ephemeral
      # service container and never leave the job.
      #
      # This step used to sit below the direct leg, under the pooled banner, which is why the direct leg had
      # nothing but the superuser to offer the preview server.
      - name: Give the five roles passwords, and hand the app role to both legs
        run: |
          set -euo pipefail
          # `role:ENV_VAR` pairs rather than an associative array — `declare -A` needs bash 4+, and a
          # workflow should not carry a shell-version dependency it can avoid in one line.
          for pair in app:DATABASE_URL auth:DATABASE_AUTH_URL worker:DATABASE_WORKER_URL \
                      platform:DATABASE_PLATFORM_URL capability:DATABASE_CAPABILITY_URL; do
            role="${pair%%:*}"
            url_var="${pair##*:}"
            var="BUILDERHUNT_$(echo "$role" | tr '[:lower:]' '[:upper:]')_PASSWORD"
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
            PGPASSWORD=${{ github.run_id }} psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "ALTER ROLE builderhunt_${role} WITH PASSWORD '${value}'"
            # Direct-leg URLs, one per role rather than four fallbacks to `DATABASE_URL`.
            #
            # `smoke.ts` defaults the other four to whatever `DATABASE_URL` holds, which would run the whole
            # direct leg as `builderhunt_app` — including the auth and worker paths that exist precisely
            # because they carry different privileges. The pooled leg already names each role separately; this
            # makes the direct leg as faithful.
            #
            # The database is `postgres` here and not the disposable one on purpose: `smoke.ts` rewrites the
            # database name itself via `withDatabase`, and naming the target here would state it in two places.
            echo "${url_var}=postgresql://builderhunt_${role}:${value}@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
          done
          admin="$(openssl rand -hex 16)"
          echo "::add-mask::$admin"
          echo "PGBOUNCER_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"

      # The smoke serves `dist` deliberately — a harness that only works against `vite dev` proves nothing
      # about the artifact that gets deployed.
      #
      # After the two steps above, not before them, and not because the build needs a database: it is so the
      # build runs with `DATABASE_URL` present, exactly as it did when that variable was job-level env. Moving
      # it earlier would have been a guess about whether anything in the build reads it, and a build that fails
      # for a missing runtime variable is a confusing way to learn the answer.
      - name: Build
        run: pnpm build

      # Both legs now connect as `builderhunt_app`, so RLS is in the path for both and the latencies mean the
      # same thing. `smoke.ts` prints a warning when the application is about to connect as a superuser; that
      # warning has never been reachable in CI, because the server refused to boot before it could be printed.
      - name: Load smoke — direct
        run: pnpm test:load:smoke

      # ── The pooled leg ───────────────────────────────────────────────────────────────────────────
      #
      # The direct leg above proves the harness works. This one proves the *topology* production will run
      # does: PgBouncer authenticates against a `userlist.txt` built from the five `builderhunt_*` roles, so
      # the pooled run reaches PostgreSQL through the same pooler production sits behind.
      #
      # This used to be described as "the more faithful of the two", on the grounds that the direct leg
      # connected as this job's superuser and so ran with RLS out of the path. That is no longer the
      # difference — both legs authenticate as `builderhunt_app` now. What separates them is the pooler, which
      # is the only thing this leg is here to exercise.
      - name: Build and start PgBouncer
        run: |
          set -euo pipefail
          docker build -t builderhunt-pgbouncer ./docker/pgbouncer
          docker run -d --name builderhunt-pgbouncer --network host \
            --tmpfs /run/pgbouncer:mode=0700,uid=10001,gid=10001 \
            -e BUILDERHUNT_APP_PASSWORD -e BUILDERHUNT_AUTH_PASSWORD -e BUILDERHUNT_WORKER_PASSWORD \
            -e BUILDERHUNT_PLATFORM_PASSWORD -e BUILDERHUNT_CAPABILITY_PASSWORD \
            -e PGBOUNCER_ADMIN_PASSWORD \
            -e PGBOUNCER_UPSTREAM_HOST=127.0.0.1 \
            builderhunt-pgbouncer
          # `--network host` so `127.0.0.1:5432` inside the container is the service container's Postgres,
          # and so the smoke reaches the pooler on 6432 without a published-port dance.
          for _ in $(seq 1 30); do
            if PGPASSWORD="$PGBOUNCER_ADMIN_PASSWORD" psql -h 127.0.0.1 -p 6432 -U pgbouncer -d pgbouncer \
                 -Atc 'SHOW CONFIG' >/dev/null 2>&1; then
              echo 'pgbouncer answering on 6432'; exit 0
            fi
            sleep 2
          done
          echo 'pgbouncer never answered on 6432'; docker logs builderhunt-pgbouncer; exit 1

      - name: Load smoke — pooled
        env:
          LOAD_SMOKE_POOLED: 'true'
        run: pnpm test:load:smoke

      - name: PgBouncer logs
        if: always()
        run: docker logs builderhunt-pgbouncer 2>&1 | tail -40 || true

      # Uploaded on success too, and not only on failure: the report *is* the evidence a run happened and
      # what it observed, and a green run whose artifact nobody kept is a green run nobody can check.
      - name: Upload the load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-smoke-reports
          path: tests/artifacts/load/
          if-no-files-found: ignore
          retention-days: 7
