name: Load smoke

# The load harness itself, exercised end to end on every change to it.
#
# ## What this is for, and what it deliberately is not
#
# It is not a capacity measurement. A GitHub runner is a shared two-core machine with unpredictable
# neighbours, so its percentiles describe the runner and would fail or pass for reasons that have nothing to
# do with the change under test. `scripts/load/smoke.ts` therefore gates on correctness only — requests
# happened, none 5xx'd, the observability samples have data behind them, neither artifact carries a credential
# — and prints the thresholds without gating on them.
#
# What it protects is the harness's own habit of producing *plausible* artifacts. Every bug found while
# building it was of that shape: a preflight that passed against an unseeded database, a monitor whose every
# sample failed while the report printed "0 connections ✅", a route table that sent all nine requests to one
# endpoint, a drain window that aborted any run longer than thirty seconds. None of those fail loudly. All of
# them are caught by running the thing and reading what comes out, which is what this job does.
#
# ## Why it is its own workflow rather than a step in Quality
#
# Quality is ~55 runner minutes and already gates every push. Adding a build-plus-server-plus-database smoke
# to it would slow the gate everyone waits on, to protect files almost no change touches. Scoped by `paths`,
# this runs when the harness changes and stays silent otherwise.
on:
  pull_request:
    paths:
      - 'scripts/load/**'
      - 'docker/pgbouncer/**'
      - 'tests/unit/scripts/load/**'
      - '.github/workflows/load-smoke.yml'
  push:
    branches: [master, dev]
    paths:
      - 'scripts/load/**'
      - 'docker/pgbouncer/**'
      - 'tests/unit/scripts/load/**'
      - '.github/workflows/load-smoke.yml'
  # The harness is also the thing an operator reaches for at 02:00, so it has to be runnable on demand
  # without pushing a commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # The build is the long pole. A hung job otherwise bills the six-hour runner default.
    timeout-minutes: 20
    services:
      postgres:
        # The same pin as Quality and as the production resource. A plain `postgres:18` makes
        # `CREATE EXTENSION vector` fail inside migration 0013, which rolls back every migration in the same
        # transaction — and the smoke migrates a database of its own, so it would hit exactly that.
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Provisioned because the application expects it, not because the smoke asserts on it. Without Redis,
      # `rate-limit.ts` falls back to its in-memory counter — which works, and means the run measures a code
      # path production does not take. The service costs seconds; the fidelity is the point.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 127.0.0.1 and not `localhost`: on some runners `localhost` resolves to `::1` first while the service
      # container publishes on IPv4, and the failure reads as "database refused the connection".
      #
      # The smoke creates and migrates `builderhunt_load_test_smoke` from this URL. It never touches the
      # database named here, and `safety.ts` refuses outright unless the *target* name carries the disposable
      # prefix and the host is loopback.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      APP_URL: http://127.0.0.1:3000
      VITE_APP_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      REDIS_URL: redis://127.0.0.1:6379
      NODE_OPTIONS: --max-old-space-size=4096
      # Fifteen, not the twenty-five the plan's task asked for.
      #
      # `better-auth.ts` caps `/sign-in/email` at 20 per minute per IP, and all fifteen virtual users sign in
      # from the runner. Twenty-five aborts on the 21st with a `429` — verified locally, and correct
      # behaviour from the application. The alternative is raising a brute-force guard to make a smoke pass,
      # which is not a trade worth making for a larger number in a correctness check. Fifteen users over
      # thirty seconds still reaches every route from the traffic mix and collects several five-second
      # observability samples.
      LOAD_SMOKE_USERS: '15'
      LOAD_SMOKE_SECONDS: '30'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, because they are seconds and they catch the unit-testable half of a regression before the
      # build spends minutes on the rest.
      - name: Unit tests for the load harness
        run: pnpm vitest run tests/unit/scripts/load/

      # The smoke serves `dist` deliberately — a harness that only works against `vite dev` proves nothing
      # about the artifact that gets deployed.
      - name: Build
        run: pnpm build

      - name: Load smoke
        run: pnpm test:load:smoke

      # Uploaded on success too, and not only on failure: the report *is* the evidence a run happened and
      # what it observed, and a green run whose artifact nobody kept is a green run nobody can check.
      - name: Upload the load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-smoke-report
          path: tests/artifacts/load/
          if-no-files-found: ignore
          retention-days: 7
