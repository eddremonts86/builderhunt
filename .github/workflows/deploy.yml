name: Deploy to Coolify

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: coolify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # A hung job bills the runner default of six hours. On a metered account that is the
    # difference between a bad run and a bad month.
    timeout-minutes: 15
    steps:
      - name: Trigger deployment
        id: trigger
        run: |
          resp=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.COOLIFY_API_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/start")
          echo "$resp"
          uuid=$(printf '%s' "$resp" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(JSON.parse(d).deployment_uuid||"")}catch{process.stdout.write("")}})')
          echo "deployment_uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment to finish
        if: steps.trigger.outputs.deployment_uuid != ''
        run: |
          uuid="${{ steps.trigger.outputs.deployment_uuid }}"
          for i in $(seq 1 40); do
            sleep 10
            resp=$(curl -fsS -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
              "${{ secrets.COOLIFY_API_URL }}/api/v1/deployments/$uuid")
            dstatus=$(printf '%s' "$resp" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(JSON.parse(d).status||"?")}catch{process.stdout.write("?")}})')
            echo "poll $i: $dstatus"
            case "$dstatus" in
              finished|success) exit 0 ;;
              failed|error|cancelled) echo "::error::Deployment $dstatus"; exit 1 ;;
            esac
          done
          echo "::error::timeout"; exit 1

      # Coolify saying "finished" means the container started, not that the app works. Those are not
      # the same claim, and this repo has the scar: a deploy reported finished against a Postgres
      # image without pgvector, `CREATE EXTENSION vector` rolled back every migration in its
      # transaction, the org tables vanished and sign-in answered 500 — all while the pipeline showed
      # green. A deploy that is not verified is a deploy you find out about from a user.
      #
      # `/api/health` is deliberately static: it proves the process is serving. The second probe asks
      # for a real page, because a process that answers a constant and nothing else is exactly the
      # failure above.
      - name: Verify production actually answers
        run: |
          set -uo pipefail
          BASE="https://builderhunt.dev"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/api/health" || echo 000)
            [ "$code" = "200" ] && break
            echo "poll $i: /api/health -> $code"
            [ "$i" = 30 ] && { echo "::error::$BASE/api/health never returned 200 after the deploy"; exit 1; }
            sleep 5
          done
          echo "health ok"

          page=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/" || echo 000)
          if [ "$page" != "200" ]; then
            echo "::error::$BASE/ returned $page — the process is up but not serving the app"
            exit 1
          fi
          echo "landing ok"
          echo "✅ Deployed and verified: $BASE" >> "$GITHUB_STEP_SUMMARY"
