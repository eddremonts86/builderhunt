      # them. `env.ts` defaults every one of these to off, so CI was exercising a different product.
      SCHEDULING_ENABLED: 'true'
      CANDIDATE_UPLOADS_ENABLED: 'true'
      CANDIDATE_WEB_IMPORT_ENABLED: 'true'
      CALENDAR_OPERATIONAL_LAYERS_ENABLED: 'true'
      ACCESS_ALLOWLIST_ENABLED: 'true'
      DEVPOST_ENABLED: 'true'
      ABUSE_ENFORCEMENT_MODE: warn
      ENRICHMENT_ALLOWED_CONNECTORS: github
      # The billing suite drives the fake provider, but the page still renders its unavailable state
      # unless billing is on — `billing-journeys.spec.ts` waited 20s for content that was never
      # going to exist.
      STRIPE_BILLING_ENABLED: 'true'
      # Turning billing on makes env.ts require these three. Prefix-validated, so a bare
      # placeholder fails validation rather than a test. The suite drives the fake provider and
      # signs its own webhooks with STRIPE_WEBHOOK_SECRET, so the values only have to be
      # well-formed and consistent — the real test-mode keys live in the sandbox job.
      # Carries the sk_test_ prefix because env.ts validates it, which means it also satisfies the
      # `hasRealTestKey` half of the certification suites' `shouldRun`. The only thing keeping them
      # skipped in this job is that RUN_STRIPE_INTEGRATION_TESTS is not set here — do not set it,
      # or three suites will point a key that authenticates nothing at the real Stripe API.
      STRIPE_SECRET_KEY: sk_test_ci_only_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_only_not_a_real_secret
      STRIPE_API_VERSION: 2026-06-24.dahlia

