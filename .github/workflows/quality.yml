name: Quality

on:
  pull_request:
  push:
    branches: [master, codex/security-multitenancy]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: builderhunt_security_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Required by the E2E harness, not optional. `playwright.config.ts` defaults REDIS_URL to
      # redis://localhost:6379 and `e2e/harness/cache.ts` refuses to run without it — E2E deliberately
      # exercises the real cache path, because the in-memory rate-limit fallback is forbidden under
      # E2E_MODE. Without this service every spec failed with "Connection is closed" against a port
      # nothing was listening on. Same image and port as the `redis` service in docker-compose.yml, so
      # local and CI agree.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/builderhunt_security_test_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/builderhunt_security_test_ci
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@127.0.0.1:5432/builderhunt_security_test_ci
      DATABASE_AUTH_URL: postgresql://builderhunt_auth:test-auth-password@127.0.0.1:5432/builderhunt_security_test_ci
      DATABASE_WORKER_URL: postgresql://builderhunt_worker:test-worker-password@127.0.0.1:5432/builderhunt_security_test_ci
      DATABASE_PLATFORM_URL: postgresql://builderhunt_platform:test-platform-password@127.0.0.1:5432/builderhunt_security_test_ci
      APP_URL: http://localhost:3000
      VITE_APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:migration-integrity
      - run: pnpm exec drizzle-kit check
      - run: pnpm test:migrations:local
      - run: node scripts/db/prepare-rls-fixture.mjs
      - name: Verify exact runtime roles and RLS
        # Also covers the 5 abuse-and-usage-integrity tables (user_devices, account_risk,
        # seat_usage_daily, session_signals, abuse_signals) — see docs/operations/database-roles.md.
        env:
          RLS_TEST_APP_URL: postgresql://builderhunt_app:test-app-password@127.0.0.1:5432/builderhunt_security_test_ci
          RLS_TEST_AUTH_URL: postgresql://builderhunt_auth:test-auth-password@127.0.0.1:5432/builderhunt_security_test_ci
          RLS_TEST_WORKER_URL: postgresql://builderhunt_worker:test-worker-password@127.0.0.1:5432/builderhunt_security_test_ci
          RLS_TEST_PLATFORM_URL: postgresql://builderhunt_platform:test-platform-password@127.0.0.1:5432/builderhunt_security_test_ci
        run: pnpm test:rls:local
      - name: Two-tenant API/worker/privacy isolation (real routes, exact roles)
        # Also covers /api/admin/abuse[/clusters] and /api/me/sessions route-handler isolation.
        env:
          OWNER_SEED_URL: postgresql://postgres:postgres@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_URL: postgresql://builderhunt_app:test-app-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_AUTH_URL: postgresql://builderhunt_auth:test-auth-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_WORKER_URL: postgresql://builderhunt_worker:test-worker-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_PLATFORM_URL: postgresql://builderhunt_platform:test-platform-password@127.0.0.1:5432/builderhunt_security_test_ci
        run: pnpm test:api-isolation:local
      - name: Restore rehearsal
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres builderhunt_security_test_ci_restore
          RESTORE_TEST_SOURCE_URL="$TEST_MIGRATION_URL" \
          RESTORE_TEST_TARGET_URL=postgresql://postgres:postgres@127.0.0.1:5432/builderhunt_security_test_ci_restore \
          pnpm db:restore-test
      - run: pnpm security:boundaries
      - run: pnpm security:route-coverage
      - run: pnpm security:provider-metering
      - name: Tenant schema classification (informational until contract phase)
        continue-on-error: true
        run: pnpm db:audit-schema
      - run: pnpm lint
      - run: pnpm type-check
      # Includes the ABUSE_ENFORCEMENT_MODE=observe kill-switch smoke
      # (src/shared/lib/abuse/enforcement-kill-switch.test.ts) — no separate step needed, `pnpm test`
      # picks up every *.test.ts file already.
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end team-accounts journey
        # No `--` before the path: pnpm forwards it to playwright, which treats it as
        # end-of-options and then never applies the path as a test filter. The step ran all ten spec
        # files instead of the one it names — slower, and nothing said so. The other nine are
        # therefore still unrun by CI; enabling them is a separate decision about job duration.
        #
        # `--workers=1` because playwright.config.ts sets a default of 2 and its own comment says this
        # spec "still shares fixtures" and needs serialized state. Running it at the default was
        # inviting flake that would have looked like a product bug.
        run: pnpm test:e2e e2e/team-accounts.spec.ts --workers=1
      - run: pnpm security:dependencies
      - run: pnpm build
      - name: Migrate + seed admin for the production-preview accessibility gate
        run: |
          pnpm exec drizzle-kit migrate
          pnpm db:seed:admin
      # `pnpm preview --port 3000 &` on its own loses the server the moment the step ends: the
      # background process inherits the step's stdout pipe, the runner closes that pipe at the step
      # boundary, and the next write earns an EPIPE. `/api/health` is a static 200 that touches neither
      # the DB nor Redis, so a health timeout here never meant "the app is unhealthy" — it meant the
      # server was already dead. Redirecting to a file (which is also what scripts/ci/local-quality.sh
      # does, and why the same gate passed locally while failing here) keeps it alive, and printing
      # that file on failure means the next timeout arrives with the server's own reason attached
      # instead of six words and a dead end.
      # `vite preview` serves the production build with NODE_ENV=production, which switches on the
      # production half of the env contract (src/shared/lib/env.ts: `if (data.NODE_ENV !== 'production')
      # return`). The job-level env points every role URL at the postgres superuser, and production
      # rightly refuses that: the runtime role must not be an owner, and the migration, auth, worker and
      # product identities must all be distinct. Left unset, the server accepted the connection, then
      # threw a ZodError on the first request and answered 500 — so `curl -sf` saw an unhealthy server
      # for sixty seconds while the process itself was perfectly alive.
      #
      # Giving it the four real roles is not a workaround: the accessibility gate is the only step that
      # exercises the app as production assembles it, so it should hold the role separation production
      # requires. The passwords are the fixture's CI values (scripts/db/prepare-rls-fixture.mjs), which
      # this job already applied to the shared roles because CI=true.
      - name: Start production preview
        env:
          DATABASE_URL: postgres://builderhunt_app:test-app-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_AUTH_URL: postgres://builderhunt_auth:test-auth-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_WORKER_URL: postgres://builderhunt_worker:test-worker-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_PLATFORM_URL: postgres://builderhunt_platform:test-platform-password@127.0.0.1:5432/builderhunt_security_test_ci
          DATABASE_MIGRATION_URL: postgres://postgres:postgres@127.0.0.1:5432/builderhunt_security_test_ci
        run: |
          nohup pnpm preview --port 3000 > /tmp/preview.log 2>&1 &
          disown
      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 2
          done
          echo "Preview server never became healthy; its output follows." >&2
          cat /tmp/preview.log >&2 || echo "(no /tmp/preview.log was written)" >&2
          exit 1
      - name: Accessibility gate (axe-core, public + authenticated route matrix)
        run: pnpm test:a11y
      - name: Upload sanitized accessibility artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: test/artifacts/a11y/
          retention-days: 14

  # Optional, additive certification of the real Stripe-backed BillingProvider
  # (src/shared/lib/billing/real-provider.ts) against Stripe's actual test-mode API — never a
  # replacement for the `quality` job above, which never talks to Stripe (FakeBillingProvider only).
  # Runs only when a real Stripe test-mode secret key is configured as a repo/org secret; skipped
  # entirely (not failed) otherwise, so forks and contributors without Stripe credentials are never
  # blocked. `continue-on-error: true` because it depends on a live third-party API — network
  # flakiness or a Stripe-side issue must never block a merge; see
  # docs/operations/stripe-sandbox-certification.md for what this does and doesn't certify.
  #
  # DO NOT gate this job with `if: ${{ secrets.X != '' }}`. The `secrets` context is NOT available in
  # `jobs.<job_id>.if` (only `github`, `needs`, `vars`, and `inputs` are), and referencing an
  # unavailable context there is a workflow *validation* error rather than a job error: GitHub
  # rejects the whole file before creating a single job, so every run — including the `quality` job
  # below, which has nothing to do with Stripe — dies in 0s with "This run likely failed because of a
  # workflow file issue" and no logs or annotations to explain it. That is exactly what happened
  # between 2026-07-24 and 2026-07-27, which also left `deploy.yml` permanently skipped because it
  # keys off a successful Quality run.
  #
  # `secrets` IS available in `jobs.<job_id>.env`, and `env` IS available in a step-level `if`, so the
  # presence check lives on the steps instead. Every step is gated, so with no key configured the job
  # claims a runner, skips everything, and finishes in seconds.
  stripe-sandbox-certification:
    name: Stripe sandbox certification (optional, real test-mode API)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_API_VERSION: '2026-06-24.dahlia'
      RUN_STRIPE_INTEGRATION_TESTS: '1'
    steps:
      - name: Report whether a Stripe test-mode key is configured
        # Named so the reason for a no-op job is visible in the run without opening a step.
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            echo "Stripe test-mode key configured — running certification."
          else
            echo "No STRIPE_SANDBOX_SECRET_KEY configured — skipping certification (not a failure)."
          fi
      - uses: actions/checkout@v7
        if: env.STRIPE_SECRET_KEY != ''
      - uses: pnpm/action-setup@v6
        if: env.STRIPE_SECRET_KEY != ''
        with:
          version: 10
      - uses: actions/setup-node@v7
        if: env.STRIPE_SECRET_KEY != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.STRIPE_SECRET_KEY != ''
      - run: pnpm vitest run src/shared/lib/billing/real-provider.test.ts
        if: env.STRIPE_SECRET_KEY != ''
