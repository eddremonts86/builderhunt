# Build the images Coolify actually ships.
#
# Whatever else CI runs here, it runs on the host. Coolify does not: it builds
# these Dockerfiles, and that is where a drifted lockfile, a dependency added
# without committing the lock, or a package the host had and the image does not
# will fail. A repo can be entirely green and still be undeployable.
#
# Deliberately a separate file. Every existing workflow in this repo keeps doing
# what it did; this only adds the check none of them had.
#
# The job name matches the one in every other repo on purpose: one required
# status check spelled the same way across the fleet.
name: Image

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Build the images Coolify ships
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web (Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
