# Profiles:
#   standalone — start just the DB when workspace-postgres is not running
#                (handled automatically by `pnpm db:up`)

services:
  db:
    profiles: ['standalone']
    image: pgvector/pgvector:pg16
    container_name: builderhunt-db
    # Dev only: default max_connections=100 has been exhausted more than
    # once by the combination of a running dev server + drizzle-kit +
    # vitest + ad-hoc tsx scripts, each opening their own postgres() pool.
    # Bumped for local headroom — not a production tuning recommendation.
    command: ['postgres', '-c', 'max_connections=200']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: builderhunt
    ports:
      - '5432:5432'
    volumes:
      - builderhunt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ['standalone']
    image: redis:7-alpine
    container_name: builderhunt-redis
    ports:
      - '6379:6379'
    volumes:
      - builderhunt_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Self-hosted embedding provider for the semantic-search plan
  # (src/shared/lib/ai/embeddings.ts). Ollama exposes an OpenAI-compatible
  # POST /v1/embeddings endpoint out of the box — no app code change needed,
  # just point AI_EMBEDDING_URL at it (see .env.example / .env.production.example).
  # `nomic-embed-text` matches the 768-dim model used in local dev via LM
  # Studio (text-embedding-nomic-embed-text-v1.5, same underlying model
  # family) — AI_EMBEDDING_DIM stays 768, no schema/migration change.
  # Entrypoint override: start the server, pull the model once (idempotent —
  # `ollama pull` no-ops if already present), then wait on the server process
  # so container lifecycle matches `ollama serve` exiting/restarting normally.
  embeddings:
    profiles: ['standalone']
    image: ollama/ollama:latest
    container_name: builderhunt-embeddings
    entrypoint: ['/bin/sh', '-c', 'ollama serve & pid=$$!; sleep 3; ollama pull nomic-embed-text; wait $$pid']
    ports:
      - '11434:11434'
    volumes:
      - builderhunt_ollama_data:/root/.ollama
    healthcheck:
      # First boot downloads the model (~270MB) — generous start_period so
      # compose doesn't report unhealthy while the pull is in progress.
      test: ['CMD-SHELL', 'ollama list | grep -q nomic-embed-text || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  builderhunt_postgres_data:
  builderhunt_redis_data:
  builderhunt_ollama_data: