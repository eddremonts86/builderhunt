# Profiles:
#   standalone — start just the DB when workspace-postgres is not running
#                (handled automatically by `pnpm db:up`)

services:
  db:
    profiles: ['standalone']
    image: pgvector/pgvector:pg16
    container_name: builderhunt-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: builderhunt
    ports:
      - '5432:5432'
    volumes:
      - builderhunt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ['standalone']
    image: redis:7-alpine
    container_name: builderhunt-redis
    ports:
      - '6379:6379'
    volumes:
      - builderhunt_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  builderhunt_postgres_data:
  builderhunt_redis_data: