# Profiles:
#   standalone — start just the DB when workspace-postgres is not running
#                (handled automatically by `pnpm db:up`)
#   load       — the PgBouncer pooler for plan 55's load work. Deliberately its own profile: a bare
#                `docker compose up` must not change the topology a developer's app connects through,
#                because a pooler in the path silently changes what session state survives a statement.
#
#                Start it with **both** profiles, because `pgbouncer` depends on `db` and Compose
#                refuses a dependency whose profile is inactive:
#
#                  docker compose --profile standalone --profile load up -d
#
#                `--profile load` alone answers `depends on undefined service "db"`, which is Compose
#                being right rather than a misconfiguration — a pooler with no database behind it would
#                start, bind 6432 and refuse every connection.

services:
  db:
    profiles: ['standalone']
    # Image MUST stay a `pgvector/pgvector:*` image — migration 0013 runs
    # `CREATE EXTENSION vector` and a plain `postgres:18*` image makes the
    # whole chain roll back. Pinned to the 0.8.5-pg18 tag (not the
    # floating `pg18`) because the README reasons about 0.8.5-specific
    # HNSW behaviour, and floating tags drift. Bumped from `pg16` on
    # 2026-07-29 by the postgres-18-upgrade plan; the previous pg16
    # volume is NOT readable on 18 — see deploy-runbook.md and
    # `pnpm db:up` requires `--profile standalone down -v` first.
    image: pgvector/pgvector:0.8.5-pg18
    container_name: builderhunt-db
    # Dev only: default max_connections=100 has been exhausted more than
    # once by the combination of a running dev server + drizzle-kit +
    # vitest + ad-hoc tsx scripts, each opening their own postgres() pool.
    # Bumped for local headroom — not a production tuning recommendation.
    # log_lock_failures=on: a migration that loses a lock race says so
    # in the log instead of timing out silently. See deploy-runbook.md
    # (PG18 observability surface). io_method is left as the default
    # `worker` because the default Docker seccomp profile blocks
    # `io_uring_setup`; `io_uring` would crash the container.
    command: ['postgres', '-c', 'max_connections=200', '-c', 'log_lock_failures=on']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: builderhunt
    ports:
      - '5432:5432'
    # PG18+ requires the mount at /var/lib/postgresql (not /var/lib/postgresql/data).
    # The new image's entrypoint refuses to start if it sees /var/lib/postgresql/data
    # already populated — see https://github.com/docker-library/postgres/issues/37.
    # The data is still under .../data inside the volume; the mount just has to point
    # one level up so `pg_upgrade --link` has somewhere to put a new cluster.
    volumes:
      - builderhunt_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── PgBouncer, for load work only (plan 55 phase 4) ────────────────────────────────────────────
  #
  # Bound to 127.0.0.1 on purpose. The pooler holds every role's password, and a container that publishes
  # 6432 on all interfaces is one `docker run` on a café network away from being reachable.
  #
  # The five role passwords come from the environment rather than this file: a committed password is a
  # committed password whatever the file is called.
  #
  # Plain `${VAR}` and not `${VAR:?...}`, which was the first attempt. Compose interpolates **every**
  # service regardless of profile, so the required-variable form made `docker compose config` fail for
  # anyone without load credentials in `.env` — a command that has nothing to do with load testing,
  # broken by a guard for it.
  #
  # The refusal belongs in `entrypoint.sh` and is already there: `set -u` plus an explicit check per
  # variable, so the container exits naming the missing one instead of writing an empty `userlist.txt`
  # that fails hours later as an authentication problem.
  pgbouncer:
    profiles: ['load']
    build:
      context: ./docker/pgbouncer
    container_name: builderhunt-pgbouncer
    depends_on:
      db:
        condition: service_healthy
    environment:
      BUILDERHUNT_APP_PASSWORD: ${BUILDERHUNT_APP_PASSWORD:-}
      BUILDERHUNT_AUTH_PASSWORD: ${BUILDERHUNT_AUTH_PASSWORD:-}
      BUILDERHUNT_WORKER_PASSWORD: ${BUILDERHUNT_WORKER_PASSWORD:-}
      BUILDERHUNT_PLATFORM_PASSWORD: ${BUILDERHUNT_PLATFORM_PASSWORD:-}
      BUILDERHUNT_CAPABILITY_PASSWORD: ${BUILDERHUNT_CAPABILITY_PASSWORD:-}
      PGBOUNCER_ADMIN_PASSWORD: ${PGBOUNCER_ADMIN_PASSWORD:-}
    ports:
      - '127.0.0.1:6432:6432'
    # tmpfs, so the generated auth file never touches a writable layer or a volume. It exists in memory
    # for the life of the container and dies with it.
    tmpfs:
      - /etc/pgbouncer:mode=0700,uid=10001,gid=10001
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U pgbouncer -d pgbouncer || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    profiles: ['standalone']
    image: redis:7-alpine
    container_name: builderhunt-redis
    ports:
      - '6379:6379'
    volumes:
      - builderhunt_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Self-hosted embedding provider for the semantic-search plan
  # (src/shared/lib/ai/embeddings.ts). Ollama exposes an OpenAI-compatible
  # POST /v1/embeddings endpoint out of the box — no app code change needed,
  # just point AI_EMBEDDING_URL at it (see .env.example / .env.production.example).
  # `nomic-embed-text` matches the 768-dim model used in local dev via LM
  # Studio (text-embedding-nomic-embed-text-v1.5, same underlying model
  # family) — AI_EMBEDDING_DIM stays 768, no schema/migration change.
  # Entrypoint override: start the server, pull the model once (idempotent —
  # `ollama pull` no-ops if already present), then wait on the server process
  # so container lifecycle matches `ollama serve` exiting/restarting normally.
  embeddings:
    profiles: ['standalone']
    image: ollama/ollama:latest
    container_name: builderhunt-embeddings
    entrypoint: ['/bin/sh', '-c', 'ollama serve & pid=$$!; sleep 3; ollama pull nomic-embed-text; wait $$pid']
    ports:
      - '11434:11434'
    volumes:
      - builderhunt_ollama_data:/root/.ollama
    healthcheck:
      # First boot downloads the model (~270MB) — generous start_period so
      # compose doesn't report unhealthy while the pull is in progress.
      test: ['CMD-SHELL', 'ollama list | grep -q nomic-embed-text || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # Candidate document storage and virus scanning, both self-hosted by decision
  # (docs/operations/interview-provider-register.md §1 and §2) rather than paid
  # vendors — which is also why there is no DPA or sub-processor entry for them.
  #
  # On the `interviews` profile, not `standalone`: ClamAV alone wants ~1.5 GB of
  # RAM and several minutes on first boot to fetch its signature database, and
  # nobody working on search or billing should pay that. Bring them up with
  # `docker compose --profile interviews up -d`.
  storage:
    profiles: ['interviews']
    image: minio/minio:latest
    container_name: builderhunt-storage
    command: server /data --console-address ":9001"
    environment:
      # Local development root credentials. Production uses a service account
      # scoped to the one bucket, never these — see the register.
      MINIO_ROOT_USER: builderhunt
      MINIO_ROOT_PASSWORD: builderhunt-local-dev
    ports:
      # 9000 is the S3 API, 9001 the console. Bound to localhost only: candidate
      # documents are personal data and the design has no public-read path.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - builderhunt_storage_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Built here rather than pulled: `clamav/clamav` is amd64-only on Docker Hub
  # and absent from ghcr.io and quay.io, while the deployment target is a
  # Hetzner CAX21 (ARM). The image comes from Alpine's own clamav package, which
  # keeps the provenance of an antivirus binary with a distro instead of an
  # unknown rebuild, and is multi-arch for free — the same Dockerfile serves an
  # amd64 laptop and an ARM server. See docker/clamav/Dockerfile.
  antivirus:
    profiles: ['interviews']
    build:
      context: ./docker/clamav
    container_name: builderhunt-antivirus
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - builderhunt_antivirus_data:/var/lib/clamav
    # No healthcheck here: it lives in the image (docker/clamav/Dockerfile), so a
    # `docker run` deployment — which is how this is deployed on the server —
    # reports health too. First boot downloads the signature database and takes
    # minutes; the scanner must not be pointed at until it passes, because an
    # unready clamd refuses connections, which looks exactly like a scan failure.

volumes:
  builderhunt_postgres_data:
  builderhunt_redis_data:
  builderhunt_ollama_data:
  builderhunt_storage_data:
  builderhunt_antivirus_data: