# Profiles:
#   standalone — start just the DB when workspace-postgres is not running
#                (handled automatically by `pnpm db:up`)

services:
  db:
    profiles: ['standalone']
    image: pgvector/pgvector:pg16
    container_name: builderhunt-db
    # Dev only: default max_connections=100 has been exhausted more than
    # once by the combination of a running dev server + drizzle-kit +
    # vitest + ad-hoc tsx scripts, each opening their own postgres() pool.
    # Bumped for local headroom — not a production tuning recommendation.
    command: ['postgres', '-c', 'max_connections=200']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: builderhunt
    ports:
      - '5432:5432'
    volumes:
      - builderhunt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ['standalone']
    image: redis:7-alpine
    container_name: builderhunt-redis
    ports:
      - '6379:6379'
    volumes:
      - builderhunt_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Self-hosted embedding provider for the semantic-search plan
  # (src/shared/lib/ai/embeddings.ts). Ollama exposes an OpenAI-compatible
  # POST /v1/embeddings endpoint out of the box — no app code change needed,
  # just point AI_EMBEDDING_URL at it (see .env.example / .env.production.example).
  # `nomic-embed-text` matches the 768-dim model used in local dev via LM
  # Studio (text-embedding-nomic-embed-text-v1.5, same underlying model
  # family) — AI_EMBEDDING_DIM stays 768, no schema/migration change.
  # Entrypoint override: start the server, pull the model once (idempotent —
  # `ollama pull` no-ops if already present), then wait on the server process
  # so container lifecycle matches `ollama serve` exiting/restarting normally.
  embeddings:
    profiles: ['standalone']
    image: ollama/ollama:latest
    container_name: builderhunt-embeddings
    entrypoint: ['/bin/sh', '-c', 'ollama serve & pid=$$!; sleep 3; ollama pull nomic-embed-text; wait $$pid']
    ports:
      - '11434:11434'
    volumes:
      - builderhunt_ollama_data:/root/.ollama
    healthcheck:
      # First boot downloads the model (~270MB) — generous start_period so
      # compose doesn't report unhealthy while the pull is in progress.
      test: ['CMD-SHELL', 'ollama list | grep -q nomic-embed-text || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # Candidate document storage and virus scanning, both self-hosted by decision
  # (docs/operations/interview-provider-register.md §1 and §2) rather than paid
  # vendors — which is also why there is no DPA or sub-processor entry for them.
  #
  # On the `interviews` profile, not `standalone`: ClamAV alone wants ~1.5 GB of
  # RAM and several minutes on first boot to fetch its signature database, and
  # nobody working on search or billing should pay that. Bring them up with
  # `docker compose --profile interviews up -d`.
  storage:
    profiles: ['interviews']
    image: minio/minio:latest
    container_name: builderhunt-storage
    command: server /data --console-address ":9001"
    environment:
      # Local development root credentials. Production uses a service account
      # scoped to the one bucket, never these — see the register.
      MINIO_ROOT_USER: builderhunt
      MINIO_ROOT_PASSWORD: builderhunt-local-dev
    ports:
      # 9000 is the S3 API, 9001 the console. Bound to localhost only: candidate
      # documents are personal data and the design has no public-read path.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - builderhunt_storage_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Built here rather than pulled: `clamav/clamav` is amd64-only on Docker Hub
  # and absent from ghcr.io and quay.io, while the deployment target is a
  # Hetzner CAX21 (ARM). The image comes from Alpine's own clamav package, which
  # keeps the provenance of an antivirus binary with a distro instead of an
  # unknown rebuild, and is multi-arch for free — the same Dockerfile serves an
  # amd64 laptop and an ARM server. See docker/clamav/Dockerfile.
  antivirus:
    profiles: ['interviews']
    build:
      context: ./docker/clamav
    container_name: builderhunt-antivirus
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - builderhunt_antivirus_data:/var/lib/clamav
    healthcheck:
      # First boot downloads the signature database and takes minutes. The
      # scanner must not be pointed at until this passes — an unready clamd
      # refuses connections, which is indistinguishable from a scan failure.
      test: ['CMD-SHELL', 'clamdscan --ping 1 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

volumes:
  builderhunt_postgres_data:
  builderhunt_redis_data:
  builderhunt_ollama_data:
  builderhunt_storage_data:
  builderhunt_antivirus_data: