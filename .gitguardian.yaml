# GitGuardian scans every pull request. These three files hold values that are shaped like secrets
# and are not secrets, which is the one case a scanner cannot decide for itself.
#
# `env.ts` validates the *shape* of these before the app will boot — `^sk_(test|live)_`, `^whsec_`,
# exactly 64 hex characters. So a CI-only placeholder has to carry the shape of the real thing or the
# job dies at import, and carrying the shape is precisely what a secret scanner looks for. The values
# themselves say what they are: `sk_test_ci_only_not_a_real_key`, `whsec_ci_only_not_a_real_secret`,
# and `0123456789abcdef` repeated four times. None of them authenticates anything, anywhere.
#
# Scoped to the workflow files by path rather than switched off globally. A real credential committed
# to `src/` or a script still fails the check, which is the reason to have it at all. The repository
# is public — anything genuine that landed here would be public with it.
#
# The real Stripe test-mode key lives in the STRIPE_SANDBOX_SECRET_KEY repository secret and is never
# written to a file in this repo. See .github/workflows/advisory.yml.

version: 2

secret:
  ignored-paths:
    - '.github/workflows/quality.yml'
    - '.github/workflows/advisory.yml'
    - '.github/workflows/nightly-serial.yml'
